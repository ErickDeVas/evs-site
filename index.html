<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <title>Erick De Vasconcelos Studios</title>
</head>
<body>
  <p style="font:16px system-ui,sans-serif;padding:2rem;color:#ececea;background:#0a0b0c">Loading EVS…</p>
  <script>
    (() => {
      const language = /^\/pt-BR(?:\/|$)/.test(location.pathname) ? 'pt-BR' : 'en';
      fetch(`/${language}.txt`, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Page unavailable');
          return response.text();
        })
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {
          document.body.innerHTML = '<p style="font:16px system-ui,sans-serif;padding:2rem">The page could not be loaded. Please refresh.</p>';
        });
    })();
  </script>
</body>
</html>
